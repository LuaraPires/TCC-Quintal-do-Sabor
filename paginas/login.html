<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="descripition" content="...">
    <meta name="keywords" content="sites, web">
    <meta name="author" content="Luara Pires">

    <link rel="icon" type="image/png" href="../favicon.png">

    <title>Sabor do Quintal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/base.css"  rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">

</head>


<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            <img src="../imagem/logo.png" class="rounded-circle" alt="Logo Sabor do Quintal" width="90" >

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <div class="login-area">

            <!-- TEXTO -->

            <div class="login-text">

                <h1>
                    Bem-vindo ao
                    <span>Sabor do Quintal!</span>
                </h1>

                <p>
                    Acesse sua conta para continuar e aproveitar
                    todos os recursos do nosso restaurante.
                </p>

            </div>


            <!-- FORMULÁRIO -->

            <div class="login-container">

                <form>

                    <h2 class="login-title">
                        Entrar
                    </h2>


                    <!-- NOME -->

                    <label for="nome" class="form-label">
                        Nome:
                    </label>

                    <input type="text" id="nome" class="form-control" placeholder="Digite seu nome">


                    <!-- EMAIL -->

                    <label for="email" class="form-label">
                        E-mail:
                    </label>

                    <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail">


                    <!-- TELEFONE -->

                    <label for="telefone" class="form-label">
                        Telefone:
                    </label>

                    <input type="tel" id="telefone" class="form-control" placeholder="(00) 00000-0000">


                    <!-- SENHA -->

                    <label for="senha" class="form-label">
                        Senha:
                    </label>

                    <input type="password" id="senha" class="form-control" placeholder="Digite sua senha">


                    <!-- ESQUECEU A SENHA -->

                    <a href="#" class="esqueceu-senha">
                        Esqueceu a senha?
                    </a>


                    <!-- BOTÃO -->

                    <button type="submit" class="btn-entrar">
                        <a href="pagina_principal.html">Entrar</a>
                    </button>

                </form>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            📞 (11) 93275-8484
        </p>

        <p>
            © 2026 Sabor do Quintal - Todos os direitos reservados
        </p>

        <a href="mailto:sabordoquintal@email.com">
            ✉ sabordoquintal@email.com
        </a>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
