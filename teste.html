<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
        content="Página oficial do Sabor do Quintal, um restaurante de estilo rústico que oferece pratos caseiros e saborosos. Conheça nosso cardápio, confira nossos pratos, faça sua reserva e encontre nossa localização.">

    <meta name="keywords" content="Sabor do Quintal, restaurante, comida caseira">

    <meta name="author" content="Luara Pires">

    <link rel="icon" type="image/png" href="../faviconn.png">

    <title>Sabor do Quintal</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Georgia, 'Times New Roman', serif;
            background-color: #f3ead8;
        }


        /* =================================
           ÁREA PRINCIPAL
        ================================= */

        .inicio {

            min-height: 100vh;

            position: relative;

            background-image: url("imagem/entrada4.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            align-items: center;
        }


        /* =================================
           CAMADA ESCURA SOBRE A IMAGEM
        ================================= */

        .inicio::before {

            content: "";

            position: absolute;

            inset: 0;

            background: rgba(35, 25, 15, 0.35);
        }


        /* =================================
           CONTEÚDO
        ================================= */

        .conteudo {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100vh;
        }


        /* =================================
           TEXTO
        ================================= */

        .texto {

            width: 950px;

            color: #080808;

            font-weight: 900;

            line-height: 1;

            text-shadow:
                1px 1px 1px rgba(255, 255, 255, 0.35);

        }


        /* =================================
           BOTÃO CADASTRE-SE
        ================================= */

        .btn-cadastro {

            position: absolute;

            right: 30px;

            bottom: 35px;

            background-color: #f27b55;

            border: none;

            color: #000000;

            font-weight: 800;

            font-size: 16px;

            padding: 14px 38px;

            border-radius: 12px;

            text-decoration: none;

            transition: 0.3s;

            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.25);
        }


        .btn-cadastro:hover {

            background-color: #d9633e;

            color: #ffffff;

            transform: scale(1.05);
        }


        /* =================================
           TABLETS
        ================================= */

        @media (max-width: 992px) {

            .texto {

                font-size: 26px;

                max-width: 750px;
            }

            .btn-cadastro {

                right: 25px;

                bottom: 30px;
            }
        }


        /* =================================
           CELULARES
        ================================= */

        @media (max-width: 768px) {

            .inicio {

                background-position: center;
            }


            .conteudo {

                height: 100vh;

                padding: 30px 20px;
            }


            .texto {

                font-size: 20px;

                max-width: 100%;

                line-height: 1.4;
            }


            .btn-cadastro {

                right: 20px;

                bottom: 25px;

                font-size: 15px;

                padding: 12px 30px;
            }
        }


        /* =================================
           CELULARES PEQUENOS
        ================================= */

        @media (max-width: 480px) {

            .texto {

                font-size: 18px;
            }


            .btn-cadastro {

                right: 15px;

                bottom: 20px;

                font-size: 14px;

                padding: 11px 25px;
            }
        }

    </style>

</head>
<body>


    <!-- =================================
         PÁGINA INICIAL
    ================================= -->

    <main class="inicio">

        <div class="container conteudo">


            <!-- TEXTO -->

            <div class="row">

                <div class="col-12">

                    <p class="texto">

                        Sabor de Mãe traz o aconchego da culinária
                        tradicional direto para a sua mesa. Com pratos
                        fartos, temperos frescos e aquele cheirinho
                        irresistível de comida feita na hora, nosso
                        restaurante oferece o verdadeiro gosto da
                        comida caseira em um ambiente acolhedor e familiar.

                    </p>

                </div>

            </div>


            <!-- BOTÃO -->

            <a href="#" class="btn-cadastro">

                Cadastre-se

            </a>


        </div>

    </main>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
